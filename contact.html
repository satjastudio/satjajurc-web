      <div class="subscribe-block">
        <p class="subscribe-text">Subscribe to the mailing list for news about upcoming shows and new available paintings.</p>

        <!-- TODO: connect to mailing service — Mailchimp/Buttondown/etc —
             this form currently only validates client-side and does not
             store or send submissions anywhere. See the matching TODO in
             js/main.js's "Subscribe form" handler. -->
        <!-- novalidate removed and type="text" (not "email") used
             deliberately: with type="email" + required and no novalidate,
             the browser's own constraint validation blocks the submit
             event entirely for BOTH an empty field and a badly-formatted
             one, showing its own native message for each case and never
             letting our JS submit handler run — that would swallow the
             custom "Please enter a valid email address!" alert the format
             check below is supposed to produce. type="text" leaves only
             the "required" (empty-field) constraint natively active;
             format checking is left entirely to the JS handler.
             inputmode="email" keeps the mobile "@"-keyboard hint that
             type="email" would otherwise have provided. -->
        <form class="subscribe-form" id="subscribeForm">
          <div class="subscribe-field">
            <label for="subscribeEmail">Email *</label>
            <input type="text" inputmode="email" id="subscribeEmail" name="email" autocomplete="email" required>
          </div>
          <button type="submit" class="subscribe-btn">Subscribe</button>
        </form>

        <p class="subscribe-success" id="subscribeSuccess" hidden>Thanks for subscribing!</p>
      </div>
    </div>
  </main>
